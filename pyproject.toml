[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-surrogate-research"
version = "0.1.0"
description = "Host-agnostic reward triage / surrogate research for RL reward candidates"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "A-Nematkhah" }]
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "scikit-learn>=1.3.0",
  "PyYAML>=6.0.1",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
rl = [
  "gymnasium>=0.29.1",
  "stable-baselines3>=2.3.0",
  "torch>=2.1.0",
  "tqdm>=4.66.0",
  "cloudpickle>=3.0.0",
]
extra = [
  "lightgbm>=4.0.0",
  "catboost>=1.2.0",
  "xgboost>=2.0.0",
]
dev = [
  "pytest>=7.4.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["rsr*", "reward_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "slow: tests that train PPO or otherwise exceed a few seconds",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
