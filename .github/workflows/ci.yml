name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev only; no rl extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify locked confirm checksums
        run: sha256sum -c CHECKSUMS.sha256
      - name: Ruff
        run: ruff check rsr reward_triage tests scripts
      - name: Pytest (not slow)
        run: pytest -m "not slow"
