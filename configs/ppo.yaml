# Stable-Baselines3 PPO configuration — Wave 3 moderate scale

algorithm: PPO

total_timesteps: 50000

n_envs: 4

learning_rate: 0.0003
gamma: 0.99
n_steps: 1024
batch_size: 64
n_epochs: 10
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5

policy:
  net_arch:
    pi: [64, 64]
    vf: [64, 64]
  activation_fn: tanh

n_seeds: 3
seeds: [0, 1, 2]

early_behavioral:
  enabled: true
  # Primary alias checkpoint (also used for legacy early_* column names)
  timesteps: 5000
  # Multi-checkpoint warmup rollouts (0→2k→5k→12k); refresh via scripts/refresh_early_features.py
  checkpoints: [2000, 5000, 12000]
  n_episodes: 20
  seed_offset: 50000
  deterministic: false
  stable_stats: true

save_freq_timesteps: 25000
log_interval: 10
tensorboard: false

device: cpu

seed_torch_deterministic: true
