# Phase 3.2 — pre-registered ranking contrast (0 PPO).
# H0: ExtraTrees regression within-family ranking is not worse than pairwise Δφ logistic.
# Primary metric: within_family_spearman_identifiable_mean
# Feature set locked: early+math+behavioral
# Does NOT write into model_comparison_confirm.

random_seed: 123
n_repeats: 1
n_jobs: 4
n_bootstrap: 2000
quick: false

features_dir: experiments/phase2/features
output_dir: experiments/benchmark_phase3_ranking
results_dir: results/benchmark_phase3_ranking

targets:
  - success_rate

feature_sets:
  - early+math+behavioral

primary:
  target: success_rate
  feature_set: early+math+behavioral
  models:
    - extra_trees
    - pairwise_logistic

models:
  - extra_trees
  - pairwise_logistic

baseline_model: extra_trees

preprocessing:
  impute: median
  drop_constant: true
  standardize_for: [ridge, pairwise_logistic]
  target_transform_options: [none]
  feature_selection_options: [top_k_by_spearman]
  top_k_values: [15, 30]
  pca_components: [5]
  default_target_transform: none
  default_feature_selection: top_k_by_spearman
  default_k: 15
  min_within_family_std: 0.0

inner_cv:
  strategy: leave_one_family_out
  optimize: within_family_spearman

topk:
  pooled_k: [5, 10, 20]
  within_family_k: 3
  min_family_size_for_within: 4

within_family_identifiability:
  enabled: true
  min_range: 0.05
  se_multiplier: 2.0
  dataset_csv: experiments/phase1/dataset/reward_performance_dataset.csv

higher_is_better:
  success_rate: true

ppo_cost_steps:
  "early+math+behavioral": 12000

hyperparameters:
  extra_trees:
    n_estimators: [250]
    max_depth: [null, 8]
    min_samples_leaf: [2, 4]
  pairwise_logistic:
    C: [0.1, 1.0, 10.0]
    within_family_only: [true]
    # Drop near-tie pairs (~ seed noise); soft filter, not SE-exact
    min_abs_delta: [0.02]
    max_pairs: [2000]

quick_overrides:
  n_repeats: 1
  n_bootstrap: 200
  hyperparameter_max_combos: 3
