# CrowdNav-aware reward pool — 12 families x 2 = 24
#
# Design vs the 2D pool:
# - Drop / demote families that were ~dead under CrowdNav (potential_shaping,
#   weak_unbalanced, extreme safety/sparse).
# - Add denser progress, time-pressure, and human-clearance families so the
#   top of the label space has real within-family diversity for LOFO.
# - Activate CrowdNav components: human_proximity, human_intrusion, crowded_progress.
#
# PPO budget for this pool: configs/ppo_crowdnav.yaml (150k timesteps).
# Active experiment root: configs/crowdnav_run.yaml → experiments/crowdnav_<run_id>/
# The quality pipeline writes candidates into that root (not a shared path).
#
# Note: with n=2 per family, within Top-3 is degenerate; pipeline uses within_k=1.

generation_seed: 42

n_candidates: 24

components:
  - progress
  - goal
  - collision
  - obstacle
  - smoothness
  - time
  - energy
  - risk
  - potential
  - nonlinear_progress
  - distance
  - human_proximity
  - human_intrusion
  - crowded_progress

component_scales:
  progress: 1.0
  goal: 1.0
  collision: 1.0
  obstacle: 1.0
  smoothness: 1.0
  time: 1.0
  energy: 1.0
  risk: 1.0
  potential: 1.0
  nonlinear_progress: 1.0
  distance: 1.0
  human_proximity: 1.0
  human_intrusion: 1.0
  crowded_progress: 1.0

families:
  # --- Core progress spectrum (main CrowdNav signal) ---
  balanced:
    description: Progress/goal with mild linear personal-space cost (no intrusion stack)
    n: 2
    weight_ranges:
      progress: [0.8, 3.0]
      goal: [8.0, 25.0]
      collision: [-25.0, -8.0]
      human_proximity: [-2.0, -0.2]
      smoothness: [-0.4, 0.0]
      time: [-0.04, -0.005]

  progress_heavy:
    description: Strong progress/goal; wide ranges for within-family diversity
    n: 2
    weight_ranges:
      progress: [1.5, 8.0]
      goal: [15.0, 50.0]
      collision: [-8.0, -1.0]
      human_proximity: [-0.8, 0.0]
      smoothness: [-0.2, 0.0]
      time: [-0.02, 0.0]

  progress_dense:
    description: Dense shaping only (progress+distance); tiny/no sparse goal — distinct from progress_heavy
    n: 2
    weight_ranges:
      progress: [3.0, 12.0]
      distance: [-0.8, -0.1]
      goal: [0.0, 3.0]
      collision: [-15.0, -3.0]
      human_proximity: [-1.2, 0.0]
      time: [-0.04, -0.005]

  time_pressure:
    description: Progress under strong time pressure (CrowdNav timeouts)
    n: 2
    weight_ranges:
      progress: [1.0, 5.0]
      goal: [10.0, 35.0]
      collision: [-20.0, -5.0]
      time: [-0.25, -0.05]
      smoothness: [-0.8, -0.1]
      human_proximity: [-1.0, 0.0]

  # --- Human / crowd structure ---
  human_clearance:
    description: Linear personal-space cost only (no intrusion/obstacle stack) + learnable progress
    n: 2
    weight_ranges:
      progress: [1.0, 4.0]
      goal: [8.0, 25.0]
      collision: [-25.0, -8.0]
      human_proximity: [-4.0, -1.0]
      time: [-0.03, -0.002]

  crowded_progress:
    description: Clearance-gated progress (new component) + mild intrusion cost
    n: 2
    weight_ranges:
      crowded_progress: [2.0, 12.0]
      goal: [8.0, 30.0]
      collision: [-25.0, -5.0]
      human_intrusion: [-4.0, -0.5]
      progress: [0.0, 1.0]
      time: [-0.03, 0.0]

  risk_sensitive:
    description: Quadratic near-agent risk with solid progress
    n: 2
    weight_ranges:
      progress: [0.8, 3.0]
      goal: [8.0, 25.0]
      collision: [-15.0, -3.0]
      risk: [-10.0, -2.0]
      human_proximity: [-2.0, 0.0]
      time: [-0.03, 0.0]

  # --- Efficiency / structure ---
  efficiency:
    description: Time + smoothness with progress (less extreme than 2D dead zone)
    n: 2
    weight_ranges:
      progress: [1.0, 4.0]
      goal: [8.0, 25.0]
      collision: [-20.0, -5.0]
      smoothness: [-2.5, -0.5]
      time: [-0.15, -0.03]
      human_proximity: [-1.5, 0.0]

  energy_aware:
    description: Action energy penalty with usable progress signal
    n: 2
    weight_ranges:
      progress: [1.0, 4.0]
      goal: [8.0, 25.0]
      collision: [-20.0, -5.0]
      energy: [-3.0, -0.5]
      human_proximity: [-1.0, 0.0]
      time: [-0.03, 0.0]

  nonlinear_progress:
    description: Signed-squared progress shaping with mild human cost
    n: 2
    weight_ranges:
      nonlinear_progress: [2.0, 12.0]
      goal: [8.0, 28.0]
      collision: [-25.0, -5.0]
      human_proximity: [-2.0, -0.1]
      progress: [0.0, 0.0]
      time: [-0.03, 0.0]

  # --- Soft safety (quadratic intrusion only; no proximity/obstacle stack) ---
  safety_moderate:
    description: Stronger safety via human_intrusion only; keep progress learnable
    n: 2
    weight_ranges:
      progress: [0.8, 3.0]
      goal: [8.0, 22.0]
      collision: [-30.0, -10.0]
      human_intrusion: [-5.0, -1.5]
      time: [-0.03, -0.002]

  # --- Contrast / weak (kept small-signal for dataset diversity) ---
  weak_contrast:
    description: Weak or mis-scaled rewards — expected poor CrowdNav learning
    n: 2
    weight_ranges:
      progress: [-0.5, 0.8]
      goal: [-2.0, 8.0]
      collision: [-5.0, 1.0]
      human_proximity: [-1.0, 1.0]
      time: [-0.02, 0.02]
      energy: [-0.5, 0.5]

output:
  # Defaults only; pipeline overrides to experiments/crowdnav_<run_id>/...
  candidates_json: experiments/crowdnav_v5_invisible_24/candidates.json
  candidates_dir: experiments/crowdnav_v5_invisible_24/candidates
