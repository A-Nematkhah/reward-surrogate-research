# Active CrowdNav experiment identity.
# Bump ``run_id`` (or pass --run-id) for every new campaign so artifacts never
# overwrite a previous PPO / surrogate tree.
#
# Paths derived by the pipeline:
#   experiments/crowdnav_<run_id>/
#   results/crowdnav_<run_id>/
#
# Archives:
#   experiments/crowdnav_v1_50k/       — 50k, legacy pool
#   experiments/crowdnav_v4_full_150k/ — 150k, 72 pool, robot visible

run_id: v5_invisible_24

# Optional human-readable tag stored in run_manifest.json
description: "CrowdNav 24 pool (12x2), PPO 150k, robot_visible=false (humans ignore robot)"

# If experiments/crowdnav_<run_id>/runs already has completed jobs and
# candidates.json pool_version differs, the pipeline refuses unless
# force_new_run is true (or CLI --force-new-run), which appends a UTC stamp.
force_new_run: false
